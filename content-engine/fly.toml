# Fly.io: one always-on server with a disk for the orders. Deploy with: fly deploy
app = "channel-studio-storefront"
primary_region = "fra"

[env]
  STOREFRONT_PUBLIC_URL = "https://channel-studio-storefront.fly.dev"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "orders"
  destination = "/app/storefront"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

# Sized for making videos: the voice model and the render browser run on this server.
[[vm]]
  size = "shared-cpu-4x"
  memory = "8gb"
